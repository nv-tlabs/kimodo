      fps: 30
      stats_path: /mnt/pfs/scalelab/yzh/kimodo_my/huggingface/hub/models--nvidia--Kimodo-G1-RP-v1/snapshots/3020ad8c419c244e0429d360163730c63c4ed011/stats/motion
      skeleton:
        _target_: kimodo.skeleton.G1Skeleton34
    llm_shape: [1, 4096]
    use_text_mask: false
    latent_dim: 1024
    ff_size: 2048
    num_layers: 16
    num_heads: 8
    activation: gelu
    dropout: 0.0
    pe_dropout: 0.0
    norm_first: false
    num_text_tokens_override: 50
    input_first_heading_angle: true

  student_denoiser:
    _target_: kimodo.model.twostage_denoiser.TwostageDenoiser
    motion_mask_mode: concat
    ckpt_path: null
    motion_rep:
      _target_: kimodo.motion_rep.KimodoMotionRep
      fps: 30
      stats_path: /mnt/pfs/scalelab/yzh/kimodo_my/huggingface/hub/models--nvidia--Kimodo-G1-RP-v1/snapshots/3020ad8c419c244e0429d360163730c63c4ed011/stats/motion
      skeleton:
        _target_: kimodo.skeleton.G1Skeleton34
    llm_shape: [1, 4096]
    use_text_mask: false
    latent_dim: 1024
    ff_size: 2048
    num_layers: 8
    num_heads: 8
    activation: gelu
    dropout: 0.0
    pe_dropout: 0.0
    norm_first: false
    num_text_tokens_override: 50
    input_first_heading_angle: true

text_encoder:
  _target_: kimodo.model.dummy_text_encoder.DummyTextEncoder
  llm_dim: 4096

data:
  num_workers: 0
  pin_memory: true
  dataset:
    _target_: kimodo.training.dataset.G1CSVTextDataset
    csv_root: /mnt/pfs/scalelab/yzh/g1_soma/csv
    timelines_path: null
    max_frames: 300
    to_normalize: true
    random_crop: true
    rotate_to_zero_prob: 0.0
    randomize_first_heading_prob: 1.0
    translate_to_zero_prob: 1.0
    text_mode: none
    source_coord_system: mujoco
    root_euler_order: xyz
    root_angle_unit: degrees
    joint_angle_unit: degrees
    root_position_unit: centimeters
    root_position_scale: 1.0
    input_fps: 120
    skip_bad_samples: true
    max_bad_sample_retries: 16
    phase2_enabled: true
    phase2_num_keyframes: 300
    phase2_constraint_mode: mixed
    phase2_constraint_policy: paper
    phase2_fullbody_prob: 0.5
    phase2_include_first: true
    phase2_include_last: true
    phase2_condition_normalized: true
    phase2_return_constraints: false
    phase2_no_constraint_prob: 0.0
    phase2_mix_two_patterns_prob: 0.0
    phase2_bias_towards_fewer_keyframes: false
    phase2_dense_path_stride: 1
    phase2_end_effector_joint_pool: [LeftHand, RightHand, LeftFoot, RightFoot]
    phase2_pattern_weights:
      fullbody_sparse: 0.0
      endeffector_sparse: 0.0
      fivepoint_dense: 1.0
      root2d_sparse: 0.0
      root2d_dense: 0.0
      foot_contacts_sparse: 0.0

loss:
  teacher_weight: 0.7
  gt_weight: 0.3
  constraint_loss_weight: 0.0
  teacher_constraint_loss_weight: 0.5
  gt_constraint_loss_weight: 0.5
  hand_constraint_weight: 2.0
  foot_constraint_weight: 2.0
  root_constraint_weight: 0.1
  constraint_root_acc_weight: 0.15
  constraint_root_acc_dims: [0, 2]
  constraint_heading_acc_weight: 0.2
  constraint_hand_pos_acc_weight: 3.0
  constraint_hand_pos_acc_dims: [75, 76, 77, 99, 100, 101, 18, 19, 20, 39, 40, 41]
  constraint_hand_rot_acc_weight: 1.0
  constraint_hand_rot_acc_dims: [150, 151, 152, 153, 154, 155, 198, 199, 200, 201, 202, 203, 36, 37, 38, 39, 40, 41, 78, 79, 80, 81, 82, 83]
  self_acc_weight: 5.0
  root_acc_weight: 0.3
  heading_acc_weight: 1.0
  weight_schedule:
    enabled: false
  teacher_gammas: [10.0, 2.0, 10.0, 3.0, 10.0, 4.0, 5.0]
  gt_gammas: [10.0, 2.0, 10.0, 3.0, 10.0, 4.0, 5.0]

distillation:
  teacher_steps: 100
  student_steps: 20
  student_init_from_teacher: false
  student_init_mode: teacher_layer_map
  teacher_layer_indices_for_student: [0, 2, 4, 6, 8, 10, 12, 14]

dagger:
  initial_student_ckpt: /mnt/pfs/scalelab/yzh/kimodo_my/outputs/g1_distill_16to8_100to20_schedule/ema_final.pt
  samples_per_rollout: 3
  include_t0: true

phase2:
  enabled: true
  start_step: 0
  end_step: 0
  start_keyframes: 300
  end_keyframes: 300

training:
  seed: 42
  deterministic: false
  output_dir: ./outputs/g1_distill_16to8_100to20_dagger_teacher_gt03_100k_bs4x4_k3_cosine_selfacc50_rootacc10_headingacc10_fivepoint_dense_notext

  resume: null
  total_steps: 100000
  # Rollout batch size. Effective supervised batch is batch_size * dagger.samples_per_rollout.
  batch_size: 4
  optimizer: adam_atan2
  betas: [0.9, 0.999]
  lr: 2.0e-5
  lr_schedule:
    enabled: true
    type: cosine
    warmup_steps: 2500
    min_lr: 2.0e-6
  weight_decay: 0.0
  mixed_precision: fp16
  gradient_clip: 1.0
  ema_decay: 0.997
  ema_every: 10
  cfg_dropout_text_prob: 1.0
  cfg_dropout_motion_prob: 0.0
  log_every: 50
  save_every: 5000
  skip_text_encode_errors: true
  max_text_encode_retries: 16
  max_checkpoints_to_keep: 10
  empty_cache_every_step: false

wandb:
  enabled: false
  project: kimodo-g1-distill
  entity: null
  name: g1_distill_16to8_100to20-dagger-teacher-gt03-100k-bs4x4-k3-cosine-selfacc50-rootacc10-headingacc10-fivepoint-dense-notext
  group: null
  job_type: train
